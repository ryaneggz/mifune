name: CI

on:
  push:
    branches: [main, development]
    tags: ['*.*.*']
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test

  publish-npm:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # TODO(npm-auth): NPM_TOKEN secret must be added to the repo before
      # this job will succeed. See:
      #   https://github.com/ryaneggz/mifune/settings/secrets/actions
      # Generate token at https://www.npmjs.com/settings/<user>/tokens
      # (Automation token type, "Read and Publish" scope).
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker build -t ghcr.io/ryaneggz/mifune:${VERSION} \
                       -t ghcr.io/ryaneggz/mifune:latest .
          docker push ghcr.io/ryaneggz/mifune:${VERSION}
          docker push ghcr.io/ryaneggz/mifune:latest
